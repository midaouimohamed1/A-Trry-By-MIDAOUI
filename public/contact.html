<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا - Contact Us</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
    }
    .contact-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      max-width: 650px;
      width: 100%;
      padding: 35px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }
    .header {
      text-align: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }
    .header h1 {
      color: #38bdf8;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .info-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .info-box:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }
    .icon-wrapper {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .info-text label {
      display: block;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .info-text a, .info-text span {
      color: #f8fafc;
      font-weight: bold;
      font-size: 1rem;
      text-decoration: none;
      direction: ltr;
      display: inline-block;
    }
    .info-text a:hover {
      color: #38bdf8;
      text-decoration: underline;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #38bdf8;
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-submit:hover {
      opacity: 0.9;
    }
    .success-msg {
      display: none;
      background-color: #064e3b;
      border: 1px solid #10b981;
      color: #a7f3d0;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }
    footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #334155;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="contact-card">
  <div class="header">
    <h1>📞 اتصل بنا (Contact Us)</h1>
    <p>يسعدنا تواصلك معنا بخصوص أي استفسار، اقتراح، أو دعم فني</p>
  </div>

  <div class="info-grid">
    <!-- Email Box -->
    <div class="info-box">
      <div class="icon-wrapper">✉️</div>
      <div class="info-text">
        <label>البريد الإلكتروني</label>
        <a href="mailto:medk8758@gmail.com">medk8758@gmail.com</a>
      </div>
    </div>

    <!-- Phone Box -->
    <div class="info-box">
      <div class="icon-wrapper">📱</div>
      <div class="info-text">
        <label>رقم الجوال / الهاتف</label>
        <a href="tel:0701228083">0701228083</a>
      </div>
    </div>
  </div>

  <div id="successMsg" class="success-msg">
    ✅ تم إرسال رسالتك بنجاح! سنتواصل معك في أقرب وقت.
  </div>

  <form id="contactForm" onsubmit="handleSubmit(event)">
    <div class="form-group">
      <label for="name">الاسم الكامل:</label>
      <input type="text" id="name" placeholder="أدخل اسمك هنا..." required>
    </div>

    <div class="form-group">
      <label for="email">البريد الإلكتروني:</label>
      <input type="email" id="email" placeholder="example@gmail.com" required>
    </div>

    <div class="form-group">
      <label for="message">الرسالة:</label>
      <textarea id="message" rows="4" placeholder="اكتب رسالتك هنا..." required></textarea>
    </div>

    <button type="submit" class="btn-submit">إرسال الرسالة 🚀</button>
  </form>

  <footer>
    &copy; 2026 جميع الحقوق محفوظة - اتصل بنا
  </footer>
</div>

<script>
  function handleSubmit(event) {
    event.preventDefault();
    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('contactForm').reset();
    setTimeout(() => {
      document.getElementById('successMsg').style.display = 'none';
    }, 5000);
  }
</script>

</body>
</html>
